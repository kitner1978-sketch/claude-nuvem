titulo: "Direito Previdenciário: Teoria e Prática nos Juizados Especiais Federais"
autores:
  - "Claudio Kitner"
  - "Luiz Bispo da Silva Neto"

partes:
  - parte: "I"
    titulo: "Fundamentos do Regime Geral de Previdência Social"
    capitulos:
      - id: "cap_01"
        titulo: "Evolução Histórica e Princípios Constitucionais"
        status: "pipelinado"
        temas:
          - "Seguridade social na CF/88"
          - "Princípios: solidariedade, universalidade, seletividade, distributividade, equidade na participação do custeio"
          - "Reformas constitucionais (EC 20/1998, EC 41/2003, EC 47/2005, EC 103/2019)"
          - "Impacto das reformas no RGPS"

      - id: "cap_02"
        titulo: "Segurados e Dependentes"
        status: "pipelinado"
        temas:
          - "Categorias de segurados obrigatórios (empregado, doméstico, avulso, contribuinte individual, segurado especial)"
          - "Segurado facultativo"
          - "Dependentes: classes e presunções"
          - "Perda e manutenção da qualidade de dependente"

      - id: "cap_03"
        titulo: "Período de Carência e Manutenção da Qualidade de Segurado"
        status: "pipelinado"
        temas:
          - "Carência por espécie de benefício"
          - "Período de graça (art. 15, Lei 8.213/91)"
          - "Jurisprudência sobre prorrogação do período de graça"
          - "Dispensa de carência"

      - id: "cap_04"
        titulo: "Contribuições Previdenciárias e Custeio do RGPS"
        status: "aguardando_aprovacao"
        temas:
          - "Alíquotas progressivas do segurado empregado pós-EC 103/2019 (7,5% a 14%)"
          - "Contribuição do contribuinte individual (20%) e plano simplificado (11%)"
          - "MEI: alíquota de 5% sobre SM (LC 123/2006)"
          - "Segurado facultativo: 20%, 11% ou 5% (dona de casa baixa renda)"
          - "Contribuições em atraso — indenização (art. 45-A, Lei 8.212)"
          - "Complementação de contribuições (MEI/simplificado para TC)"
          - "Compensação previdenciária entre regimes (Lei 9.796/99)"
          - "eSocial e GPS/DARF: impacto prático nos JEFs"

      - id: "cap_05"
        titulo: "Reconhecimento, Cômputo e Averbação de Tempo de Contribuição"
        status: "aguardando_aprovacao"
        temas:
          - "CNIS como prova principal (art. 29-A, Lei 8.213/91)"
          - "Retificação de dados do CNIS (via administrativa e judicial)"
          - "Atividade rural anterior a novembro/1991 (cômputo sem contribuição)"
          - "Tempo de serviço militar obrigatório"
          - "Tempo de aluno-aprendiz (Súmula 96/TCU)"
          - "Contagem recíproca RGPS/RPPS (art. 201, § 9º, CF)"
          - "Certidão de Tempo de Contribuição (CTC)"
          - "Atividades concomitantes (art. 32, Lei 8.213, alterado pela Lei 13.846/2019)"
          - "Tempo fictício: vedação pela EC 103 (art. 25, § 2º)"
          - "Conversão de tempo especial em comum (fator 1.4/1.2)"
          - "Acordos internacionais previdenciários"

